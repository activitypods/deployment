services:
  traefik:
    image: traefik:v2.11
    command:
      - '--api.dashboard=true'
      - '--api.insecure=true'
      - '--metrics'
      - '--metrics.prometheus=true'
      - '--metrics.prometheus.buckets=0.1,0.3,1.2,5.0'
      - '--providers.docker=true'
      - '--providers.docker.exposedbydefault=false'
      - '--entrypoints.web.address=:80'
      - '--entrypoints.websecure.address=:443'
      - '--entrypoints.web.http.redirections.entryPoint.to=websecure'
      - '--entrypoints.web.http.redirections.entryPoint.scheme=https'
      - '--entrypoints.web.http.redirections.entrypoint.permanent=true'
      - '--certificatesresolvers.myresolver.acme.tlschallenge=true'
      - '--certificatesresolvers.myresolver.acme.email=${LETSENCRYPT_EMAIL}'
      - '--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json'
    ports:
      - '80:80'
      - '443:443'
      - '127.0.0.1:8080:8080'
    volumes:
      - ./data/letsencrypt:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      default:
        aliases:
          - $BACKEND_DOMAIN_NAME

  fuseki:
    image: semapps/jena-fuseki-webacl:${FUSEKI_VERSION:-v1.0.1}
    # Since v1.0.1 the JVM heap is sized from this limit (65% of it, the rest being
    # needed for the TDB2 memory-mapped files). Without a limit, the heap is sized
    # from the host memory and Fuseki can starve the other containers.
    mem_limit: ${FUSEKI_MEMORY_LIMIT:-4g}
    volumes:
      - ./data/fuseki:/fuseki
    # Debug ports are only published on localhost, use an SSH tunnel to reach them
    # (e.g. ssh -L 3030:localhost:3030 user@server)
    ports:
      - '127.0.0.1:3030:3030'
    expose:
      - '3030'
    # Docker 28+ gives containers a huge nofile limit, which old JVMs fail to allocate.
    # Fuseki keeps ~30 files open per dataset (3 datasets per Pod): don't go much lower.
    ulimits:
      nofile: 1048576
    environment:
      ADMIN_PASSWORD: ${FUSEKI_PASSWORD}
      # Leave empty to use the defaults described above (e.g. "-Xmx3g" to force a heap size)
      JVM_ARGS: ${FUSEKI_JVM_ARGS:-}
    restart: unless-stopped
    healthcheck:
      test: curl --fail http://localhost:3030 || exit 1

  activitypods-backend:
    image: activitypods/backend:${ACTIVITYPODS_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      fuseki:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data/backend/actors:/app/backend/actors
      - ./data/backend/logs:/app/backend/logs
      - ./data/backend/jwt:/app/backend/jwt
      - ./data/backend/uploads:/app/backend/uploads
      - ./data/fuseki:/fuseki-data # Needed to allow the backend to access Fuseki data
    expose:
      - '3000'
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.backend.rule=Host(`${BACKEND_DOMAIN_NAME}`)'
      - 'traefik.http.routers.backend.entrypoints=websecure'
      - 'traefik.http.routers.backend.tls.certresolver=myresolver'
    env_file:
      - .env.backend
      - path: .env.backend.local
        required: false

  activitypods-frontend:
    image: activitypods/frontend:${ACTIVITYPODS_VERSION:-latest}
    depends_on:
      - activitypods-backend
    restart: unless-stopped
    expose:
      - '5000'
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.frontend.rule=Host(`${FRONTEND_DOMAIN_NAME}`)'
      - 'traefik.http.routers.frontend.entrypoints=websecure'
      - 'traefik.http.routers.frontend.tls.certresolver=myresolver'
    environment:
      VITE_CONFIG_URL: 'https://${BACKEND_DOMAIN_NAME}/.well-known/config.js'
      # Read instead of VITE_CONFIG_URL by the frontend of ActivityPods 2.2 and below
      REACT_APP_CONFIG_URL: 'https://${BACKEND_DOMAIN_NAME}/.well-known/config.js'
      # Banner shown on every page of the frontend (ActivityPods 2.3.5+), e.g. during a maintenance.
      # Set it in .env, then `docker compose up -d activitypods-frontend`
      MAINTENANCE_MESSAGE: ${MAINTENANCE_MESSAGE:-}

  redis:
    image: redis
    restart: unless-stopped
    expose:
      - '6379'
    volumes:
      - ./data/redis:/data:z
    command: [ 'redis-server', '--appendonly', 'yes' ]
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "incr", "ping" ]
    networks:
      default:
        ipv4_address: 172.20.5.11 # Fix Redis IP to make it easier to find it with a GUI

  # Automatically enable vm.overcommit_memory on host to remove Redis warnings
  # https://medium.com/@akhshyganesh/redis-enabling-memory-overcommit-is-a-crucial-configuration-68dbb77dae5f
  redis-overcommit:
    build: https://github.com/bkuhl/redis-overcommit-on-host.git
    restart: 'no'
    privileged: true
    volumes:
      - /proc/sys/vm:/mnt/vm

  arena:
    image: activitypods/arena
    restart: unless-stopped
    volumes:
      - ./arena.json:/opt/arena/src/server/config/index.json
    depends_on:
      - redis
    ports:
      - '127.0.0.1:4567:4567'
    expose:
      - '4567'
    environment:
      REDIS_HOST: 'redis'

  tripleadmin:
    image: mguihal/tripleadmin
    depends_on:
      - fuseki
    ports:
      - '127.0.0.1:3033:3033'
    environment:
      # Requests to Fuseki are proxied by the tripleadmin server, so it can use the internal hostname
      - TRIPLEADMIN_HOST=http://fuseki:3030/
      - TRIPLEADMIN_USERNAME=admin

  # For Promotheus monitoring
  # See https://github.com/prometheus/node_exporter?tab=readme-ov-file#docker
  node-exporter:
    image: quay.io/prometheus/node-exporter:latest
    restart: unless-stopped
    command:
      - '--path.rootfs=/host'
    pid: host
    volumes:
      - '/:/host:ro,rslave'
    network_mode: host

  # For Promotheus monitoring
  # See https://prometheus.io/docs/guides/cadvisor/
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    ports:
      - '127.0.0.1:8090:8080'
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

networks:
  default:
    ipam:
      config:
        - subnet: 172.20.0.0/16
          ip_range: 172.20.5.0/24
          gateway: 172.20.5.254
